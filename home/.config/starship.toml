# Single-line prompt in the style of the old fish prompt:
#   ➜ [host] dir git:(branch) status 3s
# The host only appears over SSH, so you always know if you're on the VM.
add_newline = false
format = "$character$hostname$directory$git_branch$git_state$git_status$cmd_duration"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[➜](bold yellow)"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "bold yellow"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[git:\\(]($style)[$branch](bold red)[\\)]($style) "
style = "bold blue"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"
modified = "✗"
untracked = "?"
staged = "+"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕"

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "dimmed white"
