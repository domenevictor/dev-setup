# ------------------------------------------------------------------ general
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB" # true color
set -s escape-time 10         # fast Esc in nvim without breaking over ssh/mosh
set -sg repeat-time 600
set -g focus-events on        # lets nvim notice files changed by agents
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on       # copies reach your laptop/phone clipboard (OSC 52)
set -g allow-passthrough on
set -g set-titles on
set -g display-time 2000
setw -g aggressive-resize on
setw -g mode-keys vi
setw -g monitor-bell on       # a bell in another window flags it in the status bar
set -g bell-action other

# --------------------------------------------------------------------- keys
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind Tab last-window
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind C-l send-keys C-l        # prefix C-l clears the screen (C-l moves panes)

# Names: prefix , names the window (empty = follow the active pane again),
# prefix T names the pane (shown on its border; empty = show the program again),
# prefix $ names the session (built in).
bind , command-prompt -p "Window name (empty = follow pane):" -I "#{?automatic-rename,,#W}" {
  if -F "#{==:%%,}" { set -w automatic-rename on } { rename-window -- "%%" }
}
bind T command-prompt -p "Pane name:" -I "#{@name}" "set -p @name '%%' ; if -F '#{automatic-rename}' 'set -w automatic-rename on'"
# The automatic window name follows the active pane: its name if it has one,
# otherwise the program (tmux's default). prefix , still sets a fixed name.
set -g automatic-rename-format "#{?@name,#{@name},#{?pane_in_mode,[tmux],#{pane_current_command}}}#{?pane_dead,[dead],}"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# C-h/j/k/l move between tmux panes and nvim splits (vim-tmux-navigator).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'" "select-pane -l"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ------------------------------------------------------------- status bar
# Styled like Neovim's status line in Rose Pine (mini.statusline): a rose pill,
# an overlay section, muted text on the surface color.
#
#    main   1: nvim  2: claude • ?  3: logs (zoom)         PREFIX   agent-vm  14:32
#   └rose   └current window (overlay)                       └love     └overlay └rose
#
# Agent state is stored per pane by ~/.local/bin/tmux-agent-status and shown
# after each window, one marker per agent pane:
#   • working (gold)   ? waiting for you (love)   ✓ done (foam)
#
# Palette: Rose Pine (main). For another theme, change these hex values.
set -g @c_base    "#191724"
set -g @c_surface "#1f1d2e"
set -g @c_overlay "#26233a"
set -g @c_hl_med  "#403d52"
set -g @c_muted   "#6e6a86"
set -g @c_subtle  "#908caa"
set -g @c_text    "#e0def4"
set -g @c_love    "#eb6f92"
set -g @c_gold    "#f6c177"
set -g @c_rose    "#ebbcba"
set -g @c_foam    "#9ccfd8"
set -g @c_iris    "#c4a7e7"

set -g status-interval 5
set -g status-style "bg=#1f1d2e,fg=#908caa"
set -g status-left-length 40
set -g status-right-length 80
set -g window-status-separator ""

set -g status-left "#[bg=#{@c_rose},fg=#{@c_base},bold] #S #[bg=#{@c_surface}] "
set -g status-right "#{?client_prefix,#[bg=#{@c_love}#,fg=#{@c_base}#,bold] PREFIX #[bg=#{@c_surface}] ,}#{?pane_in_mode,#[bg=#{@c_iris}#,fg=#{@c_base}#,bold] COPY #[bg=#{@c_surface}] ,}#[bg=#{@c_overlay},fg=#{@c_subtle}] #h #[bg=#{@c_rose},fg=#{@c_base},bold] %H:%M "

set -g @agent_fmt "#{?#{==:#{@agent},working}, #[fg=#{@c_gold}]•,}#{?#{==:#{@agent},waiting}, #[fg=#{@c_love}#,bold]?#[nobold],}#{?#{==:#{@agent},done}, #[fg=#{@c_foam}]✓,}"
set -g @agents_fmt "#{P:#{E:@agent_fmt}}"
# Window label, worked out from the active pane each time the bar is drawn, so
# it changes the instant you switch panes: the pane's name (prefix T) if it has
# one, else its program. A window named with prefix , always shows that name.
set -g @window_label "#{?automatic-rename,#{?@name,#{@name},#{pane_current_command}},#W}#{?window_zoomed_flag, (zoom),}"
set -g window-status-format "#[fg=#{@c_muted},nobold] #I: #[fg=#{@c_subtle}]#{E:@window_label}#[nobold]#{E:@agents_fmt} "
set -g window-status-current-format "#[bg=#{@c_overlay},fg=#{@c_rose},bold] #I: #[fg=#{@c_text}]#{E:@window_label}#[nobold]#{E:@agents_fmt} #[bg=#{@c_surface}#,nobold]"
set -g window-status-bell-style "fg=#eb6f92,bold"
set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#ebbcba"
set -g message-style "bg=#26233a,fg=#e0def4"
set -g message-command-style "bg=#26233a,fg=#e0def4"
set -g mode-style "bg=#403d52,fg=#e0def4"

# Pane titles on the border, only in windows with more than one pane:
#   ─ 2: claude • ─────
set -g pane-border-status off
set -g pane-border-format " #{pane_index}: #{?@name,#{@name},#{pane_current_command}}#{E:@agent_fmt} "
set-hook -g window-layout-changed 'set -w -F pane-border-status "#{?#{>:#{window_panes},1},top,off}"'
set-hook -g after-split-window 'set -w -F pane-border-status "#{?#{>:#{window_panes},1},top,off}"'
set-hook -g after-kill-pane 'set -w -F pane-border-status "#{?#{>:#{window_panes},1},top,off}"'
set-hook -g pane-exited 'set -w -F pane-border-status "#{?#{>:#{window_panes},1},top,off}"'

# ------------------------------------------------------------------ plugins
# Installed by install.sh into ~/.local/share/tmux/plugins (prefix I to update).
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins/"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"   # save/restore sessions (prefix C-s / C-r)
set -g @plugin "tmux-plugins/tmux-continuum"   # ...automatically, every 10 min
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-save-interval "10"
set -g @continuum-restore "on"

if-shell "test -x $HOME/.local/share/tmux/plugins/tpm/tpm" "run-shell $HOME/.local/share/tmux/plugins/tpm/tpm"
